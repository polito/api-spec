openapi: 3.0.0
info:
  title: Polito Auth API
  version: 0.0.1
  license:
    name: CC BY-NC 4.0
    url: https://creativecommons.org/licenses/by-nc/4.0/
tags:
  - name: Auth
paths:
  /auth/client:
    patch:
      operationId: Auth_appInfo
      summary: Update client version fields | Aggiorna i campi di versione del client
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UpdateInfo'
                required:
                  - data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInfoRequest'
  /auth/login:
    post:
      operationId: Auth_login
      summary: Login
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Identity'
                required:
                  - data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security:
        - {}
  /auth/logout:
    delete:
      operationId: Auth_logout
      summary: Logout
      description: Invalidates the provided token
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
  /auth/mfa/challenge:
    get:
      operationId: Mfa_fetchChallenge
      summary: Fetch pending challenge
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    allOf:
                      - $ref: '#/components/schemas/MfaChallenge'
                    nullable: true
                required:
                  - data
              example:
                data:
                  serial: EDUP000123456
                  challenge: dGhpcyBzaG91bGQgYmUgYW4gZWNkcyBwdWJsaWMga2V5Li4uIHdoYXQgZGlkIHlvdSB0aGluayB0aGlzIHdhcz8hIPCfp5AK
                  requestTs: '2025-01-01T00:00:00Z'
                  expirationTs: '2025-01-01T01:00:00Z'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
  /auth/mfa/enrol:
    post:
      operationId: Mfa_enrolMfa
      summary: Enroll a new PUSH token
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      serial:
                        type: string
                        example: EDUP000123456
                    required:
                      - serial
                required:
                  - data
              example:
                data:
                  serial: EDUP000123456
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolMfaRequest'
  /auth/mfa/status:
    get:
      operationId: Mfa_getMfaStatus
      summary: Get MFA status for the current user
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MfaStatusResponse'
                required:
                  - data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
  /auth/mfa/validate:
    post:
      operationId: Mfa_validateMfa
      summary: Validate a challenge
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                    required:
                      - success
                required:
                  - data
              example:
                data:
                  success: true
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateMfaRequest'
  /auth/profile:
    get:
      operationId: Profile_getProfile
      summary: Get user profile | Ottieni il profilo utente
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthProfile'
                required:
                  - data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
  /auth/profile/picture:
    get:
      operationId: Profile_getProfilePicture
      summary: Get user profile picture | Ottieni la foto del profilo utente
      parameters: []
      responses:
        '200':
          description: Image rendered as a JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
  /auth/profile/token:
    get:
      operationId: Profile_getAccessToken
      summary: Get an access token for a specific service | Ottieni un token di accesso per un servizio specifico
      description: 'Returns the access token as plain text, or rendered as a QR code (SVG) when requested with `Accept: image/svg+xml`. | Restituisce il token di accesso come testo, oppure come codice QR (SVG) se richiesto con `Accept: image/svg+xml`.'
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TokenType'
          explode: false
        - name: id
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: accept
          in: header
          required: true
          schema:
            type: string
            enum:
              - image/svg+xml
              - text/plain
      responses:
        '200':
          description: QR rendered as an SVG image
          content:
            image/svg+xml:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
  /auth/serviceLink/liveClass/{meetingID}:
    get:
      operationId: ServiceLink_getLiveClassLink
      summary: Get authorised service link for LiveClass meeting
      parameters:
        - name: meetingID
          in: path
          required: true
          description: LiveClass meeting identifier
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LinkToService'
                required:
                  - data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
  /auth/serviceLink/mail:
    get:
      operationId: ServiceLink_getMailLink
      summary: Get authorised service link for Mail
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LinkToService'
                required:
                  - data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
  /auth/serviceLink/moodle/{course}:
    get:
      operationId: ServiceLink_getMoodleLink
      summary: Get authorised service link for Moodle course
      parameters:
        - name: course
          in: path
          required: true
          description: Moodle course identifier
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LinkToService'
                required:
                  - data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
  /auth/serviceLink/smartcard:
    get:
      operationId: ServiceLink_getSmartCardLink
      summary: Get authenticated smartcard picture endpoint | Ottieni l'endpoint autenticato per l'immagine della smartcard
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LinkToService'
                required:
                  - data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Auth
security:
  - BearerAuth: []
components:
  schemas:
    AppInfoRequest:
      type: object
      properties:
        buildNumber:
          type: string
          example: '1060200'
        appVersion:
          type: string
          example: 1.6.2
        fcmRegistrationToken:
          type: string
          example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
    AuthProfile:
      type: object
      required:
        - username
        - firstName
        - lastName
        - allUsernames
      properties:
        username:
          type: string
          example: s290683
        firstName:
          type: string
          example: Luca
        lastName:
          type: string
          example: Pezzolla
        allUsernames:
          type: array
          items:
            type: string
          example:
            - S290683
            - S213956
    Client:
      type: object
      required:
        - buildNumber
        - appVersion
        - name
      properties:
        buildNumber:
          type: string
          example: '1060200'
        appVersion:
          type: string
          example: 1.6.2
        fcmRegistrationToken:
          type: string
          example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
        name:
          type: string
          example: Students app
        id:
          type: string
          example: 5a54f626-4b7e-488e-a0e3-300f54051510
    ClientVersionRequest:
      type: object
      required:
        - buildNumber
        - appVersion
      properties:
        buildNumber:
          type: string
          example: '1060200'
        appVersion:
          type: string
          example: 1.6.2
    Device:
      type: object
      required:
        - platform
        - toothPicCompatible
      properties:
        name:
          type: string
        platform:
          type: string
        version:
          type: string
        model:
          type: string
        manufacturer:
          type: string
        toothPicCompatible:
          type: boolean
    EnrolMfaRequest:
      type: object
      required:
        - description
        - pubkey
      properties:
        description:
          type: string
          example: some identifier you chose
        pubkey:
          type: string
          example: dGhpcyBzaG91bGQgYmUgYW4gZWNkcyBwdWJsaWMga2V5Li4uIHdoYXQgZGlkIHlvdSB0aGluayB0aGlzIHdhcz8hIPCfp5AK
      example:
        description: some identifier you chose
        pubkey: dGhpcyBzaG91bGQgYmUgYW4gZWNkcyBwdWJsaWMga2V5Li4uIHdoYXQgZGlkIHlvdSB0aGluayB0aGlzIHdhcz8hIPCfp5AK
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    EscError:
      type: object
      properties:
        code:
          type: integer
          example: 500
        message:
          type: string
          example: An error occurred
        careerId:
          type: integer
          example: 123456
    EuropeanStudentCard:
      type: object
      required:
        - canBeRequested
        - details
      properties:
        canBeRequested:
          type: boolean
        details:
          type: object
          properties:
            status:
              type: string
              enum:
                - active
                - inactive
                - expired
            inactiveStatusReason:
              type: string
              nullable: true
            cardNumber:
              type: string
            expiresAt:
              type: string
            qrCode:
              type: string
          required:
            - status
            - inactiveStatusReason
            - cardNumber
            - expiresAt
            - qrCode
          nullable: true
    FcmRegistrationRequest:
      type: object
      properties:
        fcmRegistrationToken:
          type: string
          example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
    GuideSection:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          example: Title
        content:
          type: string
          example: HTML content
    Identity:
      type: object
      required:
        - username
        - type
        - clientId
        - token
      properties:
        username:
          type: string
          example: s290683
        type:
          type: string
          example: student
        clientId:
          type: string
          example: 5a54f626-4b7e-488e-a0e3-300f54051510
        token:
          type: string
          example: c679fa38ff665df6a676acd833194385
      example:
        username: s290683
        type: student
        clientId: 5a54f626-4b7e-488e-a0e3-300f54051510
        token: c679fa38ff665df6a676acd833194385
    Lecture:
      type: object
      required:
        - id
        - startsAt
        - endsAt
        - type
        - virtualClassrooms
        - description
        - courseId
        - courseName
        - teacherId
        - place
      properties:
        id:
          type: number
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        type:
          type: string
        virtualClassrooms:
          type: array
          items:
            $ref: '#/components/schemas/RelatedVirtualClassroom'
        description:
          type: string
          nullable: true
        courseId:
          type: integer
        courseName:
          type: string
        teacherId:
          type: integer
          example: 150157
        place:
          $ref: '#/components/schemas/PlaceRef'
    LinkToService:
      type: object
      required:
        - url
      properties:
        url:
          type: string
    LoginCredentialsBasic:
      type: object
      required:
        - username
        - password
        - loginType
      properties:
        username:
          type: string
          example: s290683
        password:
          type: string
          example: moreSecret
        loginType:
          type: string
          enum:
            - basic
      allOf:
        - $ref: '#/components/schemas/LoginRequestBase'
    LoginCredentialsSSO:
      type: object
      required:
        - uid
        - key
        - loginType
      properties:
        uid:
          type: string
          example: 123456-1234-5678-123456
        key:
          type: string
          example: abcdef-abcd-efgh-abcdef
        loginType:
          type: string
          enum:
            - sso
      allOf:
        - $ref: '#/components/schemas/LoginRequestBase'
    LoginRequest:
      type: object
      oneOf:
        - $ref: '#/components/schemas/LoginCredentialsBasic'
        - $ref: '#/components/schemas/LoginCredentialsSSO'
      discriminator:
        propertyName: loginType
        mapping:
          basic: '#/components/schemas/LoginCredentialsBasic'
          sso: '#/components/schemas/LoginCredentialsSSO'
    LoginRequestBase:
      type: object
      required:
        - preferences
      properties:
        client:
          $ref: '#/components/schemas/Client'
        device:
          $ref: '#/components/schemas/Device'
        preferences:
          $ref: '#/components/schemas/UpdatePreferencesRequest'
    MfaChallenge:
      type: object
      required:
        - serial
        - challenge
        - requestTs
        - expirationTs
      properties:
        serial:
          type: string
          example: EDUP000123456
        challenge:
          type: string
          example: dGhpcyBzaG91bGQgYmUgYW4gZWNkcyBwdWJsaWMga2V5Li4uIHdoYXQgZGlkIHlvdSB0aGluayB0aGlzIHdhcz8hIPCfp5AK
        requestTs:
          type: string
          format: date-time
          example: '2025-01-01T00:00:00Z'
        expirationTs:
          type: string
          format: date-time
          example: '2025-01-01T01:00:00Z'
    MfaStatusResponse:
      type: object
      required:
        - status
        - details
      properties:
        status:
          type: string
          enum:
            - active
            - locked
            - available
            - unavailable
            - needsReauth
          description: Current MFA status for the user
        details:
          type: object
          properties:
            lastAuth:
              type: string
              format: date-time
              example: '2021-09-30T00:00:00Z'
            authCount:
              type: integer
              example: 1
            serial:
              type: string
              example: EDUP0000123456
            description:
              type: string
              example: My phone
          required:
            - lastAuth
            - authCount
          nullable: true
          description: |-
            Additional information about the MFA session.
            Present only if status is `active` or `locked`
    PlaceRef:
      type: object
      required:
        - buildingId
        - floorId
        - roomId
        - siteId
        - name
      properties:
        buildingId:
          type: string
        floorId:
          type: string
        roomId:
          type: string
        siteId:
          type: string
        name:
          type: string
    RelatedVirtualClassroom:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
          example: 150157
        title:
          type: string
          example: Lecture 1
    TokenType:
      type: string
      enum:
        - card
        - event
    UpdateInfo:
      type: object
      required:
        - suggestUpdate
      properties:
        suggestUpdate:
          type: boolean
    UpdatePreferencesRequest:
      type: object
      properties:
        language:
          type: string
          enum:
            - it
            - en
          example: it
    ValidateMfaRequest:
      type: object
      required:
        - serial
        - nonce
        - signature
      properties:
        serial:
          type: string
          example: EDUP000123456
        nonce:
          type: string
          example: 65ba9e0e5aac421a9150991638a9d697
        signature:
          type: string
          example: 83e08d9fc4be3de046318eb3c2c9ae4ede1374a5423a1487b92febc70d106994
        decline:
          type: boolean
          example: false
      example:
        serial: EDUP000123456
        nonce: 65ba9e0e5aac421a9150991638a9d697
        signature: 83e08d9fc4be3de046318eb3c2c9ae4ede1374a5423a1487b92febc70d106994
        decline: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: https://app.didattica.polito.it/api
    description: Production server
    variables: {}
  - url: https://app.didattica.polito.it/mock/api
    description: Mock server (uses example data)
    variables: {}
